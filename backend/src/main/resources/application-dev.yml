spring:
  datasource:
    url: jdbc:mysql://localhost:3306/workstudy?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  # ===== Spring AI Alibaba（通义千问 DashScope） =====
  # API Key 从环境变量 DASHSCOPE_API_KEY 读取；未配置时用占位值保证应用可启动
  # （AI 调用会快速失败，各 Agent/服务已内置降级，系统其余功能不受影响）。
  # 本地运行：先执行 $env:DASHSCOPE_API_KEY="sk-xxx" 再启动；见 backend/.env.example。
  ai:
    dashscope:
      # 占位值仅用于"无 Key 也能启动演示"，绝不代表真实密钥
      api-key: ${DASHSCOPE_API_KEY:sk-no-key-configured-placeholder}
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3
    # 无效/占位 Key 会返回 401，调低重试避免阻塞（有效 Key 下 2 次重试也足够）
    retry:
      max-attempts: 2

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:thisIsASecretKeyForJWTTokenGenerationAndItMustBeAtLeastSixtyFourCharactersLongToMeetHS512Requirements}
  expiration: 86400000

logging:
  level:
    com.workstudy: DEBUG
